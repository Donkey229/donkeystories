# Exempel för en egen server (VPS) med nginx. Laddas INTE upp till webbroten.
# Kopiera till /etc/nginx/sites-available/donkeystories, justera root/server_name
# och kör:  sudo ln -s ../sites-available/donkeystories /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# SSL-certifikat: sudo certbot --nginx -d donkeystories.com -d www.donkeystories.com

server {
    listen 80;
    listen [::]:80;
    server_name donkeystories.com www.donkeystories.com;

    root /var/www/donkeystories;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/plain;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/plain image/svg+xml application/manifest+json;

    # Samma säkerhetsrubriker som i .htaccess.
    # När YouTube-videon bäddas in: lägg till  frame-src https://www.youtube-nocookie.com
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Dolda filer (.git, .htaccess) och sådant som inte hör till sidan.
    location ~ /\.(?!well-known/) { return 404; }
    location ~ \.(md|sh|conf)$     { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # add_header i ett location-block ersätter de ovan, så upprepa dem här.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
